<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Join the trip | The Girls Trip Guide</title><link rel="stylesheet" href="/girls-app.css?v=1"></head><body><main class="auth-screen"><section class="auth-card"><img src="/assets/images/girls-trip-guide-logo.webp" alt="The Girls Trip Guide"><div class="eyebrow">Private invitation</div><h1>You’re invited.</h1><p>This link is private to you. Continue to confirm your place and open the trip.</p><button id="join" class="btn primary" style="margin-top:20px">Join the trip →</button><p id="status" style="font-size:12px"></p></section></main><script>document.getElementById('join').addEventListener('click',()=>{const u=new URL(location.href),member=u.searchParams.get('member')||'',token=u.searchParams.get('token')||'';if(!member||!token){document.getElementById('status').textContent='This invitation is incomplete. Ask the organiser for a fresh link.';return}const target=new URL('https://vtcmvwixfqyxqghibsla.supabase.co/functions/v1/girls-accept-invite');target.searchParams.set('member',member);target.searchParams.set('token',token);target.searchParams.set('confirm','1');location.href=target.toString()});</script></body></html>
