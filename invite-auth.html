<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening your trip | The Girls Trip Guide</title>
<style>
html,body{margin:0;min-height:100%;background:#fff7fb;color:#171217;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);box-sizing:border-box;border:1px solid #ffafd4;border-radius:22px;background:white;padding:32px;text-align:center}.logo{width:86px;height:86px;object-fit:contain}.eyebrow{margin-top:12px;color:#ef2f8d;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{margin:14px 0 8px;font-size:38px;line-height:1}p{margin:0;color:#6e6168;line-height:1.55}.error{color:#a31855;margin-top:14px}
</style>
</head>
<body>
<main class="wrap"><section class="card"><img class="logo" src="/assets/images/girls-trip-guide-logo.webp" alt="The Girls Trip Guide"><div class="eyebrow">Private invitation</div><h1>Opening your trip…</h1><p>Keeping this invitation tied to the correct trip.</p><p id="status" class="error"></p></section></main>
<script>
(()=>{
'use strict';
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const KEY='gtg-invite-target-trip';
const u=new URL(location.href);
const tripId=u.searchParams.get('trip_id')||'';
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const magic=hash.get('magic')||'';
const status=document.getElementById('status');
try{
  if(!UUID.test(tripId))throw new Error('This invitation is missing its trip reference. Ask the organiser for a fresh invitation.');
  const target=new URL(magic);
  if(target.protocol!=='https:'||target.hostname!=='vtcmvwixfqyxqghibsla.supabase.co')throw new Error('This invitation could not be verified. Ask the organiser for a fresh invitation.');
  sessionStorage.setItem(KEY,tripId);
  sessionStorage.setItem(`${KEY}:started`,String(Date.now()));
  location.replace(target.toString());
}catch(error){
  status.textContent=error?.message||'This invitation could not be opened.';
}
})();
</script>
</body>
</html>
