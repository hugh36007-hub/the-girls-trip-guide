name: iOS App Store preflight

on:
  push:
    branches:
      - native-app-isolated
    paths:
      - '.github/workflows/ios-app-store-preflight.yml'
      - 'scripts/configure-ios-app-store-version.mjs'
      - 'scripts/configure-ios-privacy-manifest.mjs'
      - 'scripts/configure-native-platforms.mjs'
      - 'native-app.js'
      - 'native-app.css'
      - 'native-url.js'
      - 'girls-conversation-inbox.js'
      - 'girls-media-social.js'
      - 'girls-trip-social.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_SOURCE_SHA: fe7154dd6ea4e28731f0a8bf1752c29a6a697d3b
  VERSION_NAME: 1.0.3
  BUILD_NUMBER: '4'

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout native shell
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout approved Girls web release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_SOURCE_SHA }}
          path: approved-web
          fetch-depth: 1

      - name: Verify approved source and Xcode
        run: |
          test "$(git -C approved-web rev-parse HEAD)" = "$WEB_SOURCE_SHA"
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$XCODE_MAJOR" -ge 26

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned native toolchain
        run: npm ci

      - name: Overlay approved web release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.')
          src=Path('approved-web')
          allowed={'.html','.css','.js','.webmanifest'}
          keep={'native-app.css','native-app.js','native-url.js','delete-account.html','girls-conversation-inbox.js','girls-media-social.js','girls-trip-social.js'}
          for p in root.iterdir():
              if p.is_file() and p.suffix in allowed and p.name not in keep:
                  p.unlink()
          for p in src.iterdir():
              if p.is_file() and p.suffix in allowed and p.name not in keep:
                  shutil.copy2(p,root/p.name)
          shutil.rmtree(root/'assets',ignore_errors=True)
          shutil.copytree(src/'assets',root/'assets')
          PY

      - name: Prepare native payload
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native

      - name: Verify App Store contracts
        run: |
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.storystone.thegirlstripguide;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'MARKETING_VERSION = 1.0.3;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 4;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'data-native-delete-account' mobile-web/native-app.js
          grep -Fq 'data-native-report' mobile-web/native-app.js
          grep -Fq 'data-native-block' mobile-web/native-app.js
          grep -Fq 'data-native-media-report' mobile-web/girls-media-social.js
          grep -Fq 'data-native-media-block' mobile-web/girls-media-social.js
          grep -Fq 'GTGNativeSafety' mobile-web/girls-conversation-inbox.js
          grep -Fq 'girls-finalize-invite' mobile-web/invite-return.js
          ! grep -Fq 'theboystripguide.com' mobile-web/invite-return.js

      - name: Compile release without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
