name: iOS App Store preflight

on:
  push:
    branches:
      - native-app-isolated
    paths:
      - '.github/workflows/ios-app-store-preflight.yml'
      - 'scripts/build-mobile-web.mjs'
      - 'scripts/configure-ios-app-store-version.mjs'
      - 'scripts/configure-ios-privacy-manifest.mjs'
      - 'scripts/configure-native-platforms.mjs'
      - 'native-app.js'
      - 'native-app.css'
      - 'native-url.js'
      - 'girls-conversation-inbox.js'
      - 'girls-media-social.js'
      - 'girls-trip-social.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_SOURCE_SHA: fe7154dd6ea4e28731f0a8bf1752c29a6a697d3b
  GTG_WEB_SOURCE_DIR: approved-web
  VERSION_NAME: 1.0.3
  BUILD_NUMBER: '4'
  BUNDLE_ID: com.storystone.thegirlstripguide

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout native shell
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout approved Girls web release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_SOURCE_SHA }}
          path: approved-web
          fetch-depth: 1

      - name: Verify approved source and Xcode
        run: |
          test "$(git -C approved-web rev-parse HEAD)" = "$WEB_SOURCE_SHA"
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$XCODE_MAJOR" -ge 26

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Apple signing access
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$TEAM_ID" || { echo 'Missing APPLE_TEAM_ID.'; exit 1; }
          test -n "$API_KEY_ID" || { echo 'Missing APP_STORE_CONNECT_API_KEY_ID.'; exit 1; }
          test -n "$API_ISSUER_ID" || { echo 'Missing APP_STORE_CONNECT_ISSUER_ID.'; exit 1; }
          test -n "$API_PRIVATE_KEY" || { echo 'Missing APP_STORE_CONNECT_API_PRIVATE_KEY.'; exit 1; }

      - name: Install pinned native toolchain
        run: npm ci

      - name: Prepare native payload
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native

      - name: Verify App Store contracts
        run: |
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.storystone.thegirlstripguide;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'MARKETING_VERSION = 1.0.3;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 4;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'data-native-delete-account' mobile-web/native-app.js
          grep -Fq 'data-native-report' mobile-web/native-app.js
          grep -Fq 'data-native-block' mobile-web/native-app.js
          grep -Fq 'data-native-media-report' mobile-web/girls-media-social.js
          grep -Fq 'data-native-media-block' mobile-web/girls-media-social.js
          grep -Fq 'GTGNativeSafety' mobile-web/girls-conversation-inbox.js
          grep -Fq 'girls-finalize-invite' mobile-web/invite-return.js
          ! grep -Fq 'theboystripguide.com' mobile-web/invite-return.js

      - name: Compile release without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s\n' "$API_PRIVATE_KEY" > "$KEY_PATH"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -Fq -- '-----END PRIVATE KEY-----' "$KEY_PATH"

      - name: Archive with Apple-managed signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          test -s "$IPA_PATH"

      - name: Validate signed IPA with App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload validated build to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-ios-1.0.3-build-4
          path: |
            ios/build/GirlsTripGuide.xcarchive
            ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
