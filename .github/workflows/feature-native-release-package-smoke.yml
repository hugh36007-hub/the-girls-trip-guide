name: Feature native release package smoke

on:
  push:
    branches:
      - feature/organiser-costs-default-push-2026-09-16-native
    paths:
      - '.github/workflows/feature-native-release-package-smoke.yml'
      - 'native-push.js'
      - 'native-app.js'
      - 'native-url.js'
      - 'scripts/build-mobile-web.mjs'
      - 'scripts/configure-native-platforms.mjs'
      - 'scripts/configure-native-push.mjs'
      - 'scripts/configure-ios-app-store-version.mjs'
      - 'scripts/configure-ios-privacy-manifest.mjs'
      - '.native-push-package/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: girls-feature-native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-signed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm Android signing and Firebase inputs
        env:
          KEYSTORE: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_PASSWORD }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$FIREBASE_JSON"
      - run: npm ci
      - run: npm run native:push:install
      - name: Prepare native Android payload
        run: |
          npm run mobile:prepare
          npx cap sync android
          node scripts/configure-native-platforms.mjs
          node scripts/configure-native-push.mjs
          npm run test:native
      - name: Materialise Firebase config
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_JSON" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json');if(!(j.client||[]).some(c=>c?.client_info?.android_client_info?.package_name==='com.storystone.thegirlstripguide'))process.exit(1)"
      - name: Build signed AAB
        env:
          KEYSTORE: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_PASSWORD }}
        working-directory: android
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > app/gtg-upload.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/gtg-upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Verify generated push wiring
        run: |
          grep -Fq 'capacitor-push-notifications' android/capacitor.settings.gradle
          grep -Fq 'capacitor-push-notifications' android/app/capacitor.build.gradle
          test -f mobile-web/native-push.js
          git ls-files --error-unmatch android/app/google-services.json >/dev/null 2>&1 && exit 1 || true
      - name: Remove transient Android credentials
        if: always()
        run: rm -f android/app/google-services.json android/app/gtg-upload.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: girls-feature-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios-signed-package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION_NAME: 1.0.3
      BUILD_NUMBER: '6'
      BUNDLE_ID: com.storystone.thegirlstripguide
      NATIVE_PUSH_APNS_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require current Xcode
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,".");print a[1]}')"
          test "$XCODE_MAJOR" -ge 26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Apple signing inputs
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          test -n "$TEAM_ID"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY"
          test -n "$DISTRIBUTION_P12"
          test -n "$DISTRIBUTION_P12_PASSWORD"
      - run: npm ci
      - run: npm run native:push:install
      - name: Prepare native iOS payload
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-native-push.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq '<key>aps-environment</key>' ios/App/App/App.entitlements
          grep -Fq '<string>production</string>' ios/App/App/App.entitlements
          grep -Fq 'com.apple.Push = {' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'CapacitorPushNotifications' ios/App/CapApp-SPM/Package.swift
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj
      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s\n' "$API_PRIVATE_KEY" > "$KEY_PATH"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -Fq -- '-----END PRIVATE KEY-----' "$KEY_PATH"
      - name: Import Apple Distribution certificate
        env:
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          CERT_DIR="$RUNNER_TEMP/apple-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          mkdir -p "$CERT_DIR"
          umask 077
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          cert_dir = Path(os.environ['RUNNER_TEMP']) / 'apple-signing'
          raw = os.environ['DISTRIBUTION_P12'].strip()
          prefix = 'APPLE_DISTRIBUTION_P12_BASE64='
          if raw.startswith(prefix):
              raw = raw[len(prefix):]
          raw = raw.strip().strip('"').strip("'")
          if '\n' in raw:
              raw = raw.splitlines()[0].strip()
          raw = re.sub(r'\s+', '', raw)
          data = base64.b64decode(raw, validate=True)
          if len(data) < 1000 or data[:1] != b'0':
              raise SystemExit('Decoded Apple signing package is invalid')
          (cert_dir / 'distribution.p12').write_bytes(data)
          pw = os.environ['DISTRIBUTION_P12_PASSWORD'].strip()
          pp = 'APPLE_DISTRIBUTION_P12_PASSWORD='
          if pw.startswith(pp):
              pw = pw[len(pp):]
          pw = pw.strip().strip('"').strip("'")
          if '\n' in pw:
              pw = pw.splitlines()[0].strip()
          if not pw:
              raise SystemExit('Apple signing password is empty')
          (cert_dir / 'password.txt').write_text(pw)
          PY
          P12_PASSWORD="$(cat "$CERT_DIR/password.txt")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_DIR/distribution.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq 'Apple Distribution: Storystone Ltd (25NJJVNZPZ)'
      - name: Archive signed iOS package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive
      - name: Export and verify signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          test -s "$IPA_PATH"
          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/signed-entitlements.plist" 2> "$RUNNER_TEMP/codesign.txt"
          plutil -lint "$RUNNER_TEMP/signed-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/signed-entitlements.plist")" = production
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/embedded-profile.plist")" = production
      - uses: actions/upload-artifact@v4
        with:
          name: girls-feature-signed-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove Apple signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/apple-signing"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
