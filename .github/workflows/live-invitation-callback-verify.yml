name: Live invitation callback verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-invitation-callback-verify.yml'
      - 'invite-auth.html'
      - 'invite-auth.js'
      - 'invite-return.html'
      - 'invite-return.js'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify Girls accept function returns browser redirects
        shell: bash
        run: |
          set -euo pipefail
          FUNCTION='https://vtcmvwixfqyxqghibsla.supabase.co/functions/v1/girls-accept-invite'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          probe_redirect() {
            local url="$1" expected="$2" label="$3"
            local status
            status="$(curl -sS --connect-timeout 10 --max-time 20 \
              -D "$TMP/$label.headers" -o "$TMP/$label.body" \
              -w '%{http_code}' "$url")"
            test "$status" = '303'
            grep -Eiq "^location: ${expected//\?/\\?}\r?$" "$TMP/$label.headers"
            ! grep -Eiq '^content-type: *text/html' "$TMP/$label.headers"
            test ! -s "$TMP/$label.body"
          }

          MEMBER='00000000-0000-4000-8000-000000000001'
          TOKEN='release-probe-token'
          probe_redirect \
            "$FUNCTION?member=$MEMBER&token=$TOKEN" \
            'https://thegirlstripguide.com/invite.html?member=00000000-0000-4000-8000-000000000001&token=release-probe-token' \
            'landing'
          probe_redirect \
            "$FUNCTION?member=$MEMBER&token=$TOKEN&confirm=1" \
            'https://thegirlstripguide.com/create-trip?invite=invalid' \
            'invalid'
          echo 'LIVE GIRLS ACCEPT REDIRECT VERIFICATION: PASS'

      - name: Verify current Girls callback assets are live
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://thegirlstripguide.com'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          for attempt in {1..20}; do
            if curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$BASE/invite-auth.html?release_probe=20260910-v5" -o "$TMP/auth.html" \
              && curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$BASE/invite-auth.js?v=4&release_probe=20260910-v5" -o "$TMP/auth.js" \
              && curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$BASE/invite-return.html?release_probe=20260910-v5" -o "$TMP/return.html" \
              && curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$BASE/invite-return.js?v=5&release_probe=20260910-v5" -o "$TMP/return.js" \
              && grep -Fq '/invite-auth.js?v=4' "$TMP/auth.html" \
              && grep -Fq '/invite-return.js?v=5' "$TMP/return.html" \
              && grep -Fq 'validAuthToken' "$TMP/auth.js" \
              && grep -Fq "new URL('/invite-return.html',location.origin)" "$TMP/auth.js" \
              && grep -Fq 'validAuthToken' "$TMP/return.js" \
              && grep -Fq "verifyOtp({token_hash:tokenHash,type:'email'})" "$TMP/return.js" \
              && grep -Fq 'girls-finalize-invite' "$TMP/return.js" \
              && grep -Fq 'JSON.stringify({state})' "$TMP/return.js" \
              && ! grep -Eq 'localStorage|sessionStorage|magic=|magic:actionLink|theboystripguide\.com|\^\[0-9a-f\]\{64\}\$' "$TMP/auth.js" "$TMP/return.js"; then
                echo 'LIVE GIRLS CALLBACK VERIFICATION: PASS'
                exit 0
            fi
            echo "Live assets not current yet (attempt $attempt/20); retrying in 15s..."
            sleep 15
          done
          echo 'LIVE GIRLS CALLBACK VERIFICATION: FAIL'
          exit 1
