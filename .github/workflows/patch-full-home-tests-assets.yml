name: Patch Full Home tests and assets
on:
  push:
    branches:
      - full-home-single-renderer
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-home-single-renderer
      - name: Apply exact version and browser-fixture updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path,old,new):
              p=Path(path);s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected one {old!r}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          replace_once('create-trip.html','/girls-critical-style-loader.js?v=20260909-4','/girls-critical-style-loader.js?v=20260909-5')
          replace_once('create-trip.html','/girls-app-v2.js?v=4','/girls-app-v2.js?v=5')
          replace_once('create-trip.html','/girls-hero-vault-ux.js?v=3','/girls-hero-vault-ux.js?v=4')
          replace_once('sw.js',"const CACHE_VERSION='gtg-pwa-v16';","const CACHE_VERSION='gtg-pwa-v17';")
          replace_once('sw.js','/girls-critical-style-loader.js?v=20260909-4','/girls-critical-style-loader.js?v=20260909-5')

          p=Path('tests/girls-full-trip-composition.test.mjs');s=p.read_text()
          old_line=next((line for line in s.splitlines() if line.startswith('const baseHero=mode=>')),None)
          if not old_line:
              raise SystemExit('composition test: baseHero line not found')
          replacement=textwrap.dedent('''
          const fullCoreHero=`<main class="dashboard" data-home-composition="full"><div class="shell"><section class="hero-card live-snapshot-hero" data-live-snapshot="1" data-full-hero-owner="girls-app-v2"><div class="live-hero-title"><div class="eyebrow">FOR THE RECORD</div><h1>Germany<br><span>20 days</span></h1><p>28 Sept 2026 — 30 Sept 2026</p></div><div class="live-date-card"><b>Trip dates</b><span>2 confirmed<br>20 GB · 12 months</span></div><div class="live-snapshot-bottom is-message-focused" data-focus="message"><div class="live-message-card live-message-loading" role="button" tabindex="0" aria-label="Open group chat"><div class="live-hero-label"><span>Latest message</span></div><div class="live-message-meta"><span class="live-message-avatar" aria-hidden="true"></span><b><i class="live-line live-line-short"></i></b><time></time></div><p><i class="live-line"></i><i class="live-line live-line-mid"></i></p></div><div class="live-photo-block"><div class="live-hero-label"><span>Latest photo</span><span aria-hidden="true">↻</span></div><div class="live-photo-frame"><button type="button" class="live-photo-open" data-a="vault" aria-label="Open Hidden Gallery"><span class="live-photo-empty live-data-loading" aria-label="Loading latest photo"><i></i></span></button><button type="button" class="live-photo-add" data-a="upload">+ Add trip photo</button></div></div></div></section><div class="stat-row"><button class="stat" data-tab="plan"><b>0</b></button><button class="stat" data-tab="money"><b>£0</b></button><button class="stat" data-tab="evidence"><b>0</b></button><button class="stat" data-tab="group"><b>2</b></button></div></div></main>`;
          const freeCoreHero=`<main class="dashboard" data-home-composition="free"><div class="shell"><section class="hero-card"><div class="hero-meta"><div><div class="eyebrow">Free Trip</div><h1>Germany<br><span>2026</span></h1><p>28 Sept 2026 — 30 Sept 2026</p></div><div class="trip-stamp"><b>Private trip</b><span>28 Sept 2026<br>30 Sept 2026</span></div></div></section><div class="stat-row"><button class="stat" data-tab="plan"><b>0</b></button><button class="stat" data-tab="money"><b>£0</b></button><button class="stat" data-tab="evidence"><b>0</b></button><button class="stat" data-tab="group"><b>2</b></button></div></div></main>`;
          const baseHero=mode=>mode==='full'?fullCoreHero:freeCoreHero;
          ''').strip()
          s=s.replace(old_line,replacement,1)
          s=s.replace("assert.equal(full.owner,'live-dashboard-hero');","assert.equal(full.owner,'girls-app-v2');",1)
          if "assert.equal(full.owner,'girls-app-v2');" not in s:
              raise SystemExit('composition test: core owner assertion not installed')
          p.write_text(s)

          Path('.github/workflows/patch-full-home-tests-assets.yml').unlink()
          PY
      - name: Commit controlled asset and test updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add create-trip.html sw.js tests/girls-full-trip-composition.test.mjs .github/workflows/patch-full-home-tests-assets.yml
          git commit -m "Version core Full Home renderer and update mobile fixture"
          git push origin HEAD:full-home-single-renderer
