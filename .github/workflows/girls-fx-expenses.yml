name: Girls FX expenses

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FX JavaScript syntax
        run: |
          node --check girls-fx-expenses.js
          node --check girls-fx-expenses-bootstrap.js
          node --check girls-date-flow.js
      - name: FX expense contract
        run: node tests/girls-fx-expenses.test.cjs
      - name: FX direct mobile runtime contract
        run: node tests/girls-fx-mobile-bootstrap.test.cjs
      - name: FX runtime regression
        run: node tests/girls-fx-runtime-regression.test.cjs
