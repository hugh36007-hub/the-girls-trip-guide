name: Girls live dashboard hero safety

on:
  pull_request:
    paths:
      - 'girls-live-dashboard-hero.js'
      - 'girls-app-v2.js'
      - 'girls-hero-vault-ux.js'
      - 'girls-home-hero-layout-match.js'
      - 'girls-home-social-hub-v3.js'
      - 'girls-critical-style-loader.js'
      - 'girls-date-flow.js'
      - 'girls-performance-loader.js'
      - 'girls-product-parity.js'
      - 'girls-inner-page-polish.js'
      - 'girls-mobile-evidence-grid.js'
      - 'create-trip.html'
      - 'girls-pwa-register.js'
      - 'sw.js'
      - 'scripts/girls-final-refinement-contract.mjs'
      - 'tests/girls-live-dashboard-hero.test.cjs'
      - 'tests/girls-full-home-single-renderer.test.cjs'
      - 'tests/girls-full-trip-composition.test.mjs'
      - 'tests/girls-full-trip-ui-regression.test.cjs'
      - 'tests/girls-mobile-evidence-grid.test.mjs'
      - 'tests/girls-evidence-composition-isolation.test.mjs'
      - 'tests/girls-evidence-entry-paths.test.mjs'
      - 'tests/girls-home-return-readiness.test.mjs'
      - '.github/workflows/girls-live-dashboard-hero.yml'
  push:
    branches: [main]
    paths:
      - 'girls-live-dashboard-hero.js'
      - 'girls-app-v2.js'
      - 'girls-hero-vault-ux.js'
      - 'girls-home-hero-layout-match.js'
      - 'girls-home-social-hub-v3.js'
      - 'girls-critical-style-loader.js'
      - 'girls-date-flow.js'
      - 'girls-performance-loader.js'
      - 'girls-product-parity.js'
      - 'girls-inner-page-polish.js'
      - 'girls-mobile-evidence-grid.js'
      - 'create-trip.html'
      - 'girls-pwa-register.js'
      - 'sw.js'
      - 'scripts/girls-final-refinement-contract.mjs'
      - 'tests/girls-live-dashboard-hero.test.cjs'
      - 'tests/girls-full-home-single-renderer.test.cjs'
      - 'tests/girls-full-trip-composition.test.mjs'
      - 'tests/girls-full-trip-ui-regression.test.cjs'
      - 'tests/girls-mobile-evidence-grid.test.mjs'
      - 'tests/girls-evidence-composition-isolation.test.mjs'
      - 'tests/girls-evidence-entry-paths.test.mjs'
      - 'tests/girls-home-return-readiness.test.mjs'
      - '.github/workflows/girls-live-dashboard-hero.yml'

jobs:
  verify-live-dashboard-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax
        run: node --check girls-live-dashboard-hero.js
      - name: Full Home single renderer
        run: node tests/girls-full-home-single-renderer.test.cjs
      - name: URL-constructor and hydration regression
        run: node tests/girls-live-dashboard-hero.test.cjs
      - name: Free and Full Home DOM composition
        run: node tests/girls-full-trip-ui-regression.test.cjs
      - name: Free and Full Home browser composition
        run: node tests/girls-full-trip-composition.test.mjs
      - name: Paid empty Evidence and populated grid
        run: node tests/girls-mobile-evidence-grid.test.mjs
      - name: Free and Full Evidence runtime isolation
        run: node tests/girls-evidence-composition-isolation.test.mjs
      - name: Full Evidence entry paths
        run: node tests/girls-evidence-entry-paths.test.mjs
      - name: Full Home return from Evidence
        run: node tests/girls-home-return-readiness.test.mjs
