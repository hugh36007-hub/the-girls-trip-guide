name: Girls Android signed push validation

on:
  push:
    branches: [main]
    paths:
      - '.github/native-android-validation-trigger'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm signing and Firebase access
        env:
          KEYSTORE: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_PASSWORD }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing GTG_ANDROID_UPLOAD_KEYSTORE_BASE64.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing GTG_ANDROID_UPLOAD_KEY_ALIAS.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing GTG_ANDROID_UPLOAD_KEY_PASSWORD.'; exit 1; }
          test -n "$FIREBASE_JSON" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'; exit 1; }
      - run: npm ci
      - run: npm run native:push:install
      - name: Prepare Android native push source
        run: |
          npm run mobile:prepare
          npx cap sync android
          node scripts/configure-native-platforms.mjs
          node scripts/configure-native-push.mjs
          npm run test:native
          grep -Fq 'applicationId "com.storystone.thegirlstripguide"' android/app/build.gradle
          grep -Fq 'versionCode 6' android/app/build.gradle
          grep -Fq 'versionName "1.0.3"' android/app/build.gradle
          grep -Fq 'capacitor-push-notifications' android/capacitor.settings.gradle
      - name: Install Firebase Android configuration
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_JSON" | base64 --decode > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json');const clients=j.client||[];if(!clients.some(c=>c?.client_info?.android_client_info?.package_name==='com.storystone.thegirlstripguide'))process.exit(1)"
      - name: Materialize and verify upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/gtg-upload-key.jks
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE_PATH"
          chmod 600 "$ANDROID_UPLOAD_KEYSTORE_PATH"
          test -s "$ANDROID_UPLOAD_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
      - name: Build signed Play bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/gtg-upload-key.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Verify AAB signature
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/gtg-upload-key.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GTG_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.GTG_ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB"
          EXPECTED_SHA256="$(keytool -list -v -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          ACTUAL_SHA256="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$EXPECTED_SHA256" && test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-play-release-1.0.3-build-6-native-push
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload key
        if: always()
        run: rm -f /tmp/gtg-upload-key.jks
