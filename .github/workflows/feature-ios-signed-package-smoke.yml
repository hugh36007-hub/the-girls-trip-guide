name: Feature iOS signed package smoke

on:
  push:
    branches:
      - feature/organiser-costs-default-push-2026-09-16-native
    paths:
      - '.github/workflows/feature-ios-signed-package-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: girls-feature-ios-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-signed-package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION_NAME: 1.0.3
      BUILD_NUMBER: '6'
      BUNDLE_ID: com.storystone.thegirlstripguide
      NATIVE_PUSH_APNS_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require current Xcode
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,".");print a[1]}')"
          test "$XCODE_MAJOR" -ge 26
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Apple signing inputs
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          test -n "$TEAM_ID"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY"
          test -n "$DISTRIBUTION_P12"
          test -n "$DISTRIBUTION_P12_PASSWORD"
      - run: npm ci
      - run: npm run native:push:install
      - name: Prepare native iOS payload
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-native-push.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq '<key>aps-environment</key>' ios/App/App/App.entitlements
          grep -Fq '<string>production</string>' ios/App/App/App.entitlements
          grep -Fq 'com.apple.Push = {' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'CapacitorPushNotifications' ios/App/CapApp-SPM/Package.swift
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj
      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s\n' "$API_PRIVATE_KEY" > "$KEY_PATH"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -Fq -- '-----END PRIVATE KEY-----' "$KEY_PATH"
      - name: Import Apple Distribution identity
        env:
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/apple-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          mkdir -p "$CERT_DIR"
          umask 077
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          cert_dir = Path(os.environ['RUNNER_TEMP']) / 'apple-signing'
          raw = os.environ['DISTRIBUTION_P12'].strip().lstrip('\ufeff')
          prefix = 'APPLE_DISTRIBUTION_P12_BASE64='
          if raw.startswith(prefix): raw = raw[len(prefix):]
          raw = raw.strip().strip('"').strip("'").strip('`')
          raw = re.sub(r'\s+', '', raw)
          data = base64.b64decode(raw, validate=True)
          if len(data) < 1000 or data[:1] != b'0': raise SystemExit('Decoded Apple signing package is invalid')
          (cert_dir / 'distribution.p12').write_bytes(data)
          pw = os.environ['DISTRIBUTION_P12_PASSWORD'].strip().lstrip('\ufeff')
          if 'APPLE_DISTRIBUTION_P12_PASSWORD' in pw and '=' in pw: pw = pw.split('=', 1)[1]
          pw = pw.strip().strip('"').strip("'").strip('`')
          if not pw: raise SystemExit('Apple signing password is empty')
          (cert_dir / 'password.txt').write_text(pw)
          PY
          openssl pkcs12 -in "$CERT_DIR/distribution.p12" -passin file:"$CERT_DIR/password.txt" -noout
          openssl pkcs12 -in "$CERT_DIR/distribution.p12" -passin file:"$CERT_DIR/password.txt" -clcerts -nokeys -out "$CERT_DIR/distribution-cert.pem"
          openssl pkcs12 -in "$CERT_DIR/distribution.p12" -passin file:"$CERT_DIR/password.txt" -nocerts -nodes -out "$CERT_DIR/distribution-key.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_DIR/distribution-cert.pem" -k "$KEYCHAIN_PATH" -A
          security import "$CERT_DIR/distribution-key.pem" -k "$KEYCHAIN_PATH" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq 'Apple Distribution: Storystone Ltd (25NJJVNZPZ)'
      - name: Archive signed iOS package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive
      - name: Export and verify signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_APP="$(find ios/build/GirlsTripGuide.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$ARCHIVE_APP"
          PROFILE_SRC="$ARCHIVE_APP/embedded.mobileprovision"
          test -s "$PROFILE_SRC"
          security cms -D -i "$PROFILE_SRC" > "$RUNNER_TEMP/archive-profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/archive-profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/archive-profile.plist")"
          PROFILE_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/archive-profile.plist")"
          test "${PROFILE_BUNDLE#*.}" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/archive-profile.plist")" = production
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_SRC" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_SRC" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>provisioningProfiles</key><dict>
            <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
          </dict>
          </dict></plist>
          PLIST
          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          test -s "$IPA_PATH"
          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/signed-entitlements.plist" 2> "$RUNNER_TEMP/codesign.txt"
          plutil -lint "$RUNNER_TEMP/signed-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/signed-entitlements.plist")" = production
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/embedded-profile.plist")" = production
      - uses: actions/upload-artifact@v4
        with:
          name: girls-feature-signed-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove Apple signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/apple-signing"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
