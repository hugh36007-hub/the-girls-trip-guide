name: Girls OTP email branding

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/girls-auth-otp/index.ts'
      - 'tests/girls-auth-email-branding.test.cjs'
      - '.github/workflows/girls-auth-email-branding.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/girls-auth-otp/index.ts'
      - 'tests/girls-auth-email-branding.test.cjs'
      - '.github/workflows/girls-auth-email-branding.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Branding contract
        run: node tests/girls-auth-email-branding.test.cjs
      - name: Edge Function type-check
        run: deno check supabase/functions/girls-auth-otp/index.ts
