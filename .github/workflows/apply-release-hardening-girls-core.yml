name: Apply Girls core hardening
on:
  push:
    branches: [release-hardening-20260912]
    paths:
      - '.github/workflows/apply-release-hardening-girls-core.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-hardening-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify exact core transform
        run: node scripts/apply-release-hardening-girls-core.mjs
      - name: Commit verified runtime files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add girls-app-v2.js girls-parity-refresh-20260904.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply verified Girls core release hardening"
          git push origin HEAD:release-hardening-20260912