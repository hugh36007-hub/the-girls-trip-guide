name: Feature dashboard onboarding web smoke

on:
  push:
    branches:
      - feature/organiser-costs-default-push-2026-09-16-web
  workflow_dispatch:

jobs:
  onboarding-web-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check onboarding
        run: node --check girls-dashboard-onboarding.js
      - name: Syntax check loader host
        run: node --check girls-user-facing-wording.js
      - name: Run onboarding contract tests
        run: node --test tests/dashboard-onboarding-contract.test.mjs
