name: Native store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to prepare
        required: true
        default: ios
        type: choice
        options: [ios, android, both]
      upload_to_testflight:
        description: Upload the validated iOS build to App Store Connect
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm Play signing access
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing ANDROID_KEYSTORE_BASE64.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD.'; exit 1; }
      - run: npm ci
      - run: npm run mobile:prepare && npx cap sync android && node scripts/configure-native-platforms.mjs
      - name: Build signed Play bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > app/gtg-upload.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/gtg-upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-play-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION_NAME: 1.0.3
      BUILD_NUMBER: '4'
      BUNDLE_ID: com.storystone.thegirlstripguide
      GTG_WEB_SOURCE_DIR: approved-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
          fetch-depth: 0

      - name: Checkout approved Girls web release
        uses: actions/checkout@v4
        with:
          ref: fe7154dd6ea4e28731f0a8bf1752c29a6a697d3b
          path: approved-web
          fetch-depth: 1

      - name: Require current App Store toolchain and approved source
        run: |
          test "$(git -C approved-web rev-parse HEAD)" = 'fe7154dd6ea4e28731f0a8bf1752c29a6a697d3b'
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,".");print a[1]}')"
          test "$XCODE_MAJOR" -ge 26 || { echo 'Xcode 26 or later is required.'; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Apple signing access
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$TEAM_ID" || { echo 'Missing APPLE_TEAM_ID.'; exit 1; }
          test -n "$API_KEY_ID" || { echo 'Missing APP_STORE_CONNECT_API_KEY_ID.'; exit 1; }
          test -n "$API_ISSUER_ID" || { echo 'Missing APP_STORE_CONNECT_ISSUER_ID.'; exit 1; }
          test -n "$API_PRIVATE_KEY" || { echo 'Missing APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64.'; exit 1; }

      - run: npm ci

      - name: Prepare and verify iOS source
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'data-native-media-report' mobile-web/girls-media-social.js
          grep -Fq 'GTGNativeSafety' mobile-web/girls-conversation-inbox.js
          grep -Fq 'girls-finalize-invite' mobile-web/invite-return.js

      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_PATH" API_PRIVATE_KEY="$API_PRIVATE_KEY" python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['KEY_PATH']).write_bytes(base64.b64decode(os.environ['API_PRIVATE_KEY'], validate=True))
          PY
          chmod 600 "$KEY_PATH"

      - name: Archive with Apple-managed signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            archive

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/GirlsTripGuide.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          test -s "$IPA_PATH"

      - name: Validate signed IPA with App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload validated build to TestFlight
        if: inputs.upload_to_testflight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-ios-1.0.3-build-4
          path: |
            ios/build/GirlsTripGuide.xcarchive
            ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
