name: Native store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to prepare
        required: true
        default: both
        type: choice
        options: [both, android, ios]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm Play signing access
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Owner action: add ANDROID_KEYSTORE_BASE64 after Play App Signing enrolment.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Owner action: add ANDROID_KEYSTORE_PASSWORD.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Owner action: add ANDROID_KEY_ALIAS.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Owner action: add ANDROID_KEY_PASSWORD.'; exit 1; }
      - run: npm ci
      - run: npm run mobile:prepare && npx cap sync android && node scripts/configure-native-platforms.mjs
      - name: Build signed Play bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > app/gtg-upload.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/gtg-upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-play-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Apple signing access
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$TEAM_ID" || { echo 'Owner action: complete Apple Developer enrolment and add APPLE_TEAM_ID.'; exit 1; }
          test -n "$API_KEY_ID" || { echo 'Owner action: create an App Store Connect API key and add APP_STORE_CONNECT_API_KEY_ID.'; exit 1; }
          test -n "$API_ISSUER_ID" || { echo 'Owner action: add APP_STORE_CONNECT_ISSUER_ID.'; exit 1; }
          test -n "$API_PRIVATE_KEY" || { echo 'Owner action: add APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64.'; exit 1; }
      - run: npm ci
      - run: npm run mobile:prepare && npx cap sync ios && node scripts/configure-native-platforms.mjs
      - name: Archive with Apple-managed signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$API_PRIVATE_KEY" | base64 --decode > "$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/GirlsTripGuide.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" -allowProvisioningUpdates -authenticationKeyPath "$KEY_DIR/AuthKey_$API_KEY_ID.p8" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID" archive
      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-ios-archive
          path: ios/build/GirlsTripGuide.xcarchive
          if-no-files-found: error
          retention-days: 7
