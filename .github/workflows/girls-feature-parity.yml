name: Girls feature parity

on:
  push:
    branches:
      - main
      - release/girls-feature-parity-20260828
      - release/girls-product-parity-completion-20260828
      - feature/girls-document-audience-20260828
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: JavaScript syntax
        run: |
          node --check girls-app-v2.js
          node --check girls-action-feedback.js
          node --check girls-session-guard.js
          node --check girls-date-flow.js
          node --check girls-payment-nudge.js
          node --check girls-trip-social.js
          node --check girls-chat-sheet.js
          node --check girls-product-parity.js
          node --check girls-inner-page-polish.js
          node --check girls-document-audience.js
          node --check girls-hero-vault-ux.js
          node --check girls-hidden-upload-choice.js
          node --check girls-role-aware-dock.js
          node --check girls-media-performance-max.js
          node --check girls-media-ux-plus.js
          node --check girls-evidence-parity.js
          node --check girls-media-quality-fix.js
          node --check girls-mobile-evidence-grid.js
          node --check girls-media-readiness.js
          node --check girls-home-thumbnail-prime.js
          node --check girls-direct-photo-viewer.js
          node --check girls-media-social.js
          node --check girls-media-flow-refinement.js
          node --check girls-poll-nudge.js
          node --check girls-critical-style-loader.js
          node --check girls-supabase-auth-bridge.js
          node --check girls-performance-loader.js
          node --check girls-pwa-register.js
          node --check girls-contact.js
          node --check sw.js
          node --check scripts/girls-final-refinement-contract.mjs
          node --check tests/girls-session-guard.test.cjs
          node --check tests/girls-media-ux-plus.test.cjs
          node --check tests/girls-media-performance-max.test.cjs
          node --check tests/girls-evidence-parity.test.cjs
          node --check tests/girls-mobile-evidence-grid.test.mjs
          node --check tests/girls-media-readiness.test.mjs
          node --check tests/girls-home-thumbnail-prime.test.mjs
          node --check tests/girls-media-social-contract.test.cjs
          node --check tests/girls-media-flow-refinement.test.mjs
          node --check tests/girls-poll-nudge.test.mjs
          node --check tests/girls-pwa-security-contract.test.cjs
          node --check tests/girls-contact-backend.test.cjs
          node --check tests/girls-media-deletion-integrity.test.cjs
      - name: Girls Edge Function type-check
        run: |
          deno check supabase/functions/girls-process-communications/index.ts
          deno check supabase/functions/girls-auth-otp/index.ts
          deno check supabase/functions/girls-accept-invite/index.ts
          deno check supabase/functions/girls-email-send/index.ts
          deno check supabase/functions/girls-trip-email/index.ts
          deno check supabase/functions/girls-payment-nudge/index.ts
          deno check supabase/functions/girls-stripe-checkout/index.ts
          deno check supabase/functions/girls-contact-email/index.ts
          deno check supabase/functions/media-action/index.ts
      - name: Girls backend source parity contract
        run: node tests/girls-backend-source-parity.test.cjs
      - name: Girls PWA and browser-security contract
        run: node tests/girls-pwa-security-contract.test.cjs
      - name: Girls backend support contract
        run: node tests/girls-contact-backend.test.cjs
      - name: Media permanent-deletion integrity contract
        run: node tests/girls-media-deletion-integrity.test.cjs
      - name: Existing release contract
        run: node tests/release-contract.test.cjs
      - name: Girls feature parity contract
        run: node tests/girls-feature-parity.test.cjs
      - name: Girls product parity UI contract
        run: node tests/girls-product-parity-ui.test.cjs
      - name: Girls document audience contract
        run: node tests/girls-document-audience.test.cjs
      - name: Girls hero and vault UX contract
        run: node scripts/hero-vault-ux-contract.mjs
      - name: Hidden Gallery separation contract
        run: node tests/hidden-gallery-separation.test.cjs
      - name: Hero control contract
        run: node tests/hero-control-contract.test.cjs
      - name: Role-aware dock contract
        run: node tests/role-aware-dock.test.cjs
      - name: Cross-tab session and owner guard
        run: node tests/girls-session-guard.test.cjs
      - name: Premium media UX contract
        run: node tests/girls-media-ux-plus.test.cjs
      - name: Media performance max contract
        run: node tests/girls-media-performance-max.test.cjs
      - name: Evidence parity contract
        run: node tests/girls-evidence-parity.test.cjs
      - name: Mobile Evidence visual contract
        run: node tests/girls-mobile-evidence-grid.test.mjs
      - name: Media readiness contract
        run: node tests/girls-media-readiness.test.mjs
      - name: Home thumbnail prime contract
        run: node tests/girls-home-thumbnail-prime.test.mjs
      - name: Final dashboard and critical-path contract
        run: node scripts/girls-final-refinement-contract.mjs
      - name: Media social interaction contract
        run: node tests/girls-media-social-contract.test.cjs
      - name: Media flow refinement contract
        run: node tests/girls-media-flow-refinement.test.mjs
      - name: Poll nudge contract
        run: node tests/girls-poll-nudge.test.mjs
      - name: Girls action latency regression
        run: node tests/girls-action-latency.test.cjs
      - name: 100 static product-contract regression
        run: node tests/retest-100.cjs
