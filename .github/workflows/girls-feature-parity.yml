name: Girls feature parity

on:
  push:
    branches:
      - release/girls-feature-parity-20260828
      - release/girls-product-parity-completion-20260828
      - feature/girls-document-audience-20260828
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check girls-app-v2.js
          node --check girls-product-parity.js
          node --check girls-document-audience.js
          node --check girls-hero-vault-ux.js
          node --check girls-hidden-upload-choice.js
      - name: Existing release contract
        run: node tests/release-contract.test.cjs
      - name: Girls feature parity contract
        run: node tests/girls-feature-parity.test.cjs
      - name: Girls product parity UI contract
        run: node tests/girls-product-parity-ui.test.cjs
      - name: Girls document audience contract
        run: node tests/girls-document-audience.test.cjs
      - name: Girls hero and vault UX contract
        run: node scripts/hero-vault-ux-contract.mjs
      - name: Hidden Gallery separation contract
        run: node tests/hidden-gallery-separation.test.cjs
      - name: Hero control contract
        run: node tests/hero-control-contract.test.cjs
