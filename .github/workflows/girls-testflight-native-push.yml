name: Girls native push TestFlight release

on:
  push:
    branches: [main]
    paths:
      - '.github/girls-testflight-trigger'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GTG_WEB_SOURCE_SHA: 385566f3d05f62010284765d953c42ea7987e755
      VERSION_NAME: 1.0.3
      BUILD_NUMBER: '8'
      BUNDLE_ID: com.storystone.thegirlstripguide
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app-isolated
          fetch-depth: 0
      - name: Require current App Store toolchain
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,".");print a[1]}')"
          test "$XCODE_MAJOR" -ge 26 || { echo 'Xcode 26 or later is required.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Apple signing access
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$TEAM_ID" && test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY"
      - run: npm ci
      - run: npm run native:push:install
      - name: Prepare and verify iOS native push source
        run: |
          npm run mobile:prepare
          npx cap sync ios
          node scripts/configure-native-platforms.mjs
          node scripts/configure-native-push.mjs
          node scripts/configure-ios-privacy-manifest.mjs
          node scripts/configure-ios-app-store-version.mjs
          npm run test:native
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
          grep -Fq '<key>aps-environment</key>' ios/App/App/App.entitlements
          grep -Fq 'CapacitorPushNotifications' ios/App/CapApp-SPM/Package.swift
          grep -Fq 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'CURRENT_PROJECT_VERSION = 8;' ios/App/App.xcodeproj/project.pbxproj
          grep -Fq 'girls-finalize-invite' mobile-web/invite-return.js
      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s\n' "$API_PRIVATE_KEY" > "$KEY_PATH"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -Fq -- '-----END PRIVATE KEY-----' "$KEY_PATH"
      - name: Archive with Apple-managed signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/GirlsTripGuide.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID" archive
      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath ios/build/GirlsTripGuide.xcarchive -exportPath ios/build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          test -s "$IPA_PATH"
      - name: Validate signed IPA with App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: Upload validated build to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA_PATH="$(find ios/build/export -name '*.ipa' -print -quit)"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: girls-trip-guide-ios-1.0.3-build-8-testflight
          path: |
            ios/build/GirlsTripGuide.xcarchive
            ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"