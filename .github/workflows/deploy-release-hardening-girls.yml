name: Deploy tested Girls hardening backend once

on:
  push:
    branches:
      - release-hardening-20260912
    paths:
      - .github/workflows/deploy-release-hardening-girls.yml

concurrency:
  group: deploy-girls-release-hardening-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vtcmvwixfqyxqghibsla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reverify changed backend
        run: |
          node tests/girls-backend-source-parity.test.cjs
          node tests/girls-payment-lifecycle-integrity.test.mjs
          deno check supabase/functions/girls-process-communications/index.ts
          deno check supabase/functions/girls-stripe-checkout/index.ts
      - name: Verify deployment credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy Girls communications processor
        run: npx supabase@2.115.0 functions deploy girls-process-communications --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy Girls Stripe checkout
        run: npx supabase@2.115.0 functions deploy girls-stripe-checkout --project-ref "$PROJECT_REF"
